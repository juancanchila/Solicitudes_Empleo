<!-- Firma con cargo (perfiles programador, soporte-infraestructura…). Datos de config/yo.mjs y de la clase del perfil. -->
<table cellpadding="0" cellspacing="0" role="presentation" style="font-family:Segoe UI,Arial,sans-serif;font-size:13px;color:#1f2937;margin-top:20px;border-top:1px solid #e5e7eb;padding-top:16px;">
  <tr>
    <!--SI:FOTO_RUTA--><td style="padding-right:16px;vertical-align:middle;">
      <img src="cid:foto" alt="{{NOMBRE}}" width="84" height="84" style="display:block;border-radius:50%;border:2px solid {{COLOR}};">
    </td><!--FIN:FOTO_RUTA-->
    <td style="padding-left:16px;border-left:3px solid {{COLOR}};vertical-align:middle;line-height:1.6;">
      <strong style="font-size:16px;color:#111827;letter-spacing:.2px;">{{NOMBRE}}</strong><br>
      <span style="color:{{COLOR}};font-weight:600;">{{CARGO_TITULO}}</span><br>
      <!--SI:CORREO-->✉️ <a href="mailto:{{CORREO}}" style="color:#374151;text-decoration:none;">{{CORREO}}</a>&nbsp;&nbsp;<!--FIN:CORREO-->
      <!--SI:TELEFONO-->📱 {{TELEFONO}}&nbsp;&nbsp;<!--FIN:TELEFONO--><!--SI:WHATSAPP_URL-->💬 <a href="{{WHATSAPP_URL}}" style="color:#374151;text-decoration:none;">{{WHATSAPP_TEXTO}}</a><!--FIN:WHATSAPP_URL--><br>
      <!--SI:CIUDAD-->📍 {{CIUDAD}}<br><!--FIN:CIUDAD-->
      <!--SI:LINKEDIN--><a href="{{LINKEDIN}}" style="color:{{COLOR}};text-decoration:none;font-weight:600;">LinkedIn</a>&nbsp;&nbsp;<!--FIN:LINKEDIN-->
      <!--SI:GITHUB--><a href="{{GITHUB}}" style="color:{{COLOR}};text-decoration:none;font-weight:600;">GitHub</a>&nbsp;&nbsp;<!--FIN:GITHUB-->
      <!--SI:PORTAFOLIO--><a href="{{PORTAFOLIO}}" style="color:{{COLOR}};text-decoration:none;font-weight:600;">Portafolio</a><!--FIN:PORTAFOLIO-->
    </td>
    <!--SI:FIRMA_RUTA--><td style="padding-left:20px;vertical-align:middle;">
      <img src="cid:firma" alt="Firma de {{NOMBRE}}" width="120" style="display:block;opacity:.9;">
    </td><!--FIN:FIRMA_RUTA-->
  </tr>
</table>
